<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Upload files directly to AWS S3 using pre-signed URLs">
    <title>File Upload</title>
    <link rel="stylesheet" href="upload.css" type="text/css" />
  </head>
  <body>
    <div class="block-content">
      <div id="fileUploadMessage" role="alert" aria-live="polite"></div>
      <div id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      <form
        id="fileUploadForm"
        action="#"
        method="post"
        enctype="multipart/form-data"
        aria-label="File upload form"
      >
        <div class="form-group row">
          <div class="col-12">
            <label for="file">Select file to upload:</label>
            <input type="file" id="file" name="file" aria-required="true" />
          </div>
        </div>
        <div class="form-group">
          <button type="submit" id="uploadButton" class="btn btn-alt-primary" aria-label="Upload selected file">
            Upload
          </button>
          <button type="button" id="cancelButton" class="btn btn-secondary" aria-label="Cancel upload">
            Cancel
          </button>
        </div>
      </form>
    </div>

    <script src="config.js"></script>
    <script src="upload.js"></script>
  </body>
</html>
